name: howdo
services:
  web:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-howdo.icu}
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./site:/srv:ro
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
    name: howdo_caddy_data
  caddy_config:
    name: howdo_caddy_config
