name: Check and test Docker blog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build blog and Caddy image
        run: docker build --pull -t howdo-ci .
      - name: Validate Caddy configuration
        run: docker run --rm --entrypoint caddy howdo-ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Test static server over HTTP
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name howdo-ci -e DOMAIN=http://localhost -p 127.0.0.1:18080:80 howdo-ci
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:18080/ -o /tmp/home.html
          grep -q '把问题弄懂' /tmp/home.html
          curl --fail http://127.0.0.1:18080/articles/portable-blog/ -o /dev/null
          curl --fail http://127.0.0.1:18080/rss.xml -o /dev/null
          curl --fail http://127.0.0.1:18080/sitemap-index.xml -o /dev/null
          curl --fail http://127.0.0.1:18080/search-index.json -o /dev/null
          test "$(curl -s -o /tmp/404.html -w '%{http_code}' http://127.0.0.1:18080/not-a-real-page/)" = '404'
          grep -q '这条路' /tmp/404.html
      - name: Container logs
        if: always()
        run: docker logs howdo-ci || true
      - name: Clean up test container
        if: always()
        run: docker rm -f howdo-ci || true
