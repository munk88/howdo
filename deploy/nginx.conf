# 在已有 HTTPS 配置中使用以下 server 内容；证书请按实际环境配置。
# 本示例仅监听 HTTP，不会自动签发证书。
server {
    listen 80;
    server_name howdo.icu;
    root /var/www/howdo.icu;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
