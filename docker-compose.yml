# 个人博客 Docker 部署（VPS 上运行）
# 使用官方 Caddy 镜像：托管静态站 + 自动申请/续期 HTTPS 证书
# 目录结构：./dist（构建产物）、./Caddyfile（站点配置）
services:
  blog:
    image: caddy:2-alpine
    container_name: blog
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
