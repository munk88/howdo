# 个人博客 Docker 部署（VPS 上运行）
# 说明：VPS 主机已有 Caddy 占用 80/443 并负责 HTTPS，
#       因此本容器只在内网端口提供 HTTP 静态服务，
#       由主机 Caddy 将 howdo.icu 反向代理到 127.0.0.1:8090。
services:
  blog:
    image: docker.1ms.run/library/caddy:2-alpine
    container_name: blog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
